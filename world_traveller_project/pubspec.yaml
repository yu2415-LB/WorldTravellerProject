name: world_traveller_project
description: "World Traveller - save and relive your travel memories on an interactive map."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.10.1

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.5+1
  image_picker: ^1.2.3
  flutter_map: ^8.3.1
  latlong2: ^0.10.1
  http: ^1.5.0
  path_provider: ^2.1.6
  path: ^1.9.1
  uuid: ^4.6.0
  image: ^4.5.4
  crypto: ^3.0.6
  window_manager: ^0.5.1
  google_fonts: ^6.2.1
  supabase_flutter: ^2.17.2
  shared_preferences: ^2.3.2
  mime: ^2.0.0
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

assets:
  - assets/
